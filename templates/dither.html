{{define "dither"}}
<div class="dither-lab">
  <div class="dither-canvas-wrap">
    <canvas id="ditherCanvas"></canvas>
    <div class="dither-hint">+ Mova o cursor para interagir com a luz 3D</div>
  </div>
  
  <div class="dither-controls">
    <div class="control-section">
      <div class="control-label">1. FORMATO (SHAPE)</div>
      <div class="shape-grid">
        <button class="shape-btn active" data-shape="1">Esfera 3D</button>
        <button class="shape-btn" data-shape="2">Torus (Donut)</button>
        <button class="shape-btn" data-shape="3">Vórtice Swirl</button>
        <button class="shape-btn" data-shape="4">Fluido Lava</button>
        <button class="shape-btn" data-shape="5">Radar Ripple</button>
        <button class="shape-btn" data-shape="6">Saturno 3D</button>
        <button class="shape-btn" data-shape="7">Sine Waves</button>
        <button class="shape-btn" data-shape="8">Cubo 3D</button>
      </div>
    </div>

    <div class="control-section">
      <div class="control-label">2. ESTILO DE DITHERING</div>
      <select id="ditherType" class="dither-select">
        <option value="3">Bayer 4x4 (Padrão)</option>
        <option value="4">Bayer 8x8 (Fino)</option>
        <option value="2">Bayer 2x2 (Grossa)</option>
        <option value="1">Blue / White Noise (Granulação de Areia)</option>
      </select>
    </div>

    <div class="control-section">
      <div class="control-label">3. COR DO DITHER</div>
      <div class="color-palette">
        <button class="color-btn" data-color="0.23,0.51,0.96" style="background:#3b82f6"></button>
        <button class="color-btn" data-color="0.0,0.8,0.8" style="background:#00cccc"></button>
        <button class="color-btn" data-color="0.1,0.8,0.5" style="background:#1acc80"></button>
        <button class="color-btn active" data-color="0.6,0.4,0.9" style="background:#9966e6"></button>
        <button class="color-btn" data-color="1.0,0.5,0.0" style="background:#ff8000"></button>
        <button class="color-btn" data-color="1.0,1.0,1.0" style="background:#ffffff"></button>
        <div class="hex-input">
          <span>Hex:</span>
          <input type="color" id="customColor" value="#9966e6">
        </div>
      </div>
    </div>

    <div class="control-section">
      <div class="slider-row">
        <span class="slider-label">Tamanho dos Pixels (pxSize)</span>
        <span class="slider-value" id="pxSizeVal">3.0 px</span>
      </div>
      <input type="range" id="pxSize" min="1" max="10" step="0.1" value="3">
    </div>

    <div class="control-section">
      <div class="slider-row">
        <span class="slider-label">Velocidade de Rotação</span>
        <span class="slider-value" id="speedVal">1.0x</span>
      </div>
      <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
    </div>

    <div class="control-section">
      <div class="slider-row">
        <span class="slider-label">Escala do Objeto</span>
        <span class="slider-value" id="scaleVal">0.85x</span>
      </div>
      <input type="range" id="scale" min="0.3" max="2" step="0.01" value="0.85">
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('ditherCanvas');
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });

const state = {
  shape: 1,
  ditherType: 3,
  color: [0.6, 0.4, 0.9, 1.0],
  pxSize: 3.0,
  scale: 0.85,
  speed: 1.0,
  mouseX: 0,
  mouseY: 0
};

const vertexShaderSrc = `#version 300 es
in vec2 a_position;
void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
`;

const fragmentShaderSrc = `#version 300 es
precision highp float;

uniform vec2  u_resolution;
uniform float u_time;
uniform float u_pxSize;
uniform vec4  u_color;
uniform vec2  u_mouse;
uniform float u_scale;
uniform float u_shape;
uniform int   u_ditherType;
uniform float u_speed;

out vec4 fragColor;

const int bayer8x8[64] = int[64](
   0, 32,  8, 40,  2, 34, 10, 42,
  48, 16, 56, 24, 50, 18, 58, 26,
  12, 44,  4, 36, 14, 46,  6, 38,
  60, 28, 52, 20, 62, 30, 54, 22,
   3, 35, 11, 43,  1, 33,  9, 41,
  51, 19, 59, 27, 49, 17, 57, 25,
  15, 47,  7, 39, 13, 45,  5, 37,
  63, 31, 55, 23, 61, 29, 53, 21
);

const int bayer4x4[16] = int[16](
   0,  8,  2, 10,
  12,  4, 14,  6,
   3, 11,  1,  9,
  15,  7, 13,  5
);

const int bayer2x2[4] = int[4](
  0, 2,
  3, 1
);

float getBayer8(ivec2 p) {
  int x = (p.x % 8 + 8) % 8;
  int y = (p.y % 8 + 8) % 8;
  return float(bayer8x8[y * 8 + x]) / 64.0;
}

float getBayer4(ivec2 p) {
  int x = (p.x % 4 + 4) % 4;
  int y = (p.y % 4 + 4) % 4;
  return float(bayer4x4[y * 4 + x]) / 16.0;
}

float getBayer2(ivec2 p) {
  int x = (p.x % 2 + 2) % 2;
  int y = (p.y % 2 + 2) % 2;
  return float(bayer2x2[y * 2 + x]) / 4.0;
}

float sdSphere(vec2 p, float r) { return length(p) - r; }
float sdTorus(vec2 p, float R, float r) { return abs(length(p) - R) - r; }
float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
  return v;
}

void main() {
  float pxSize = max(1.0, u_pxSize);
  vec2 pxCoord = (gl_FragCoord.xy - 0.5 * u_resolution) / pxSize;
  vec2 gridCoord = floor(pxCoord);
  ivec2 iGrid = ivec2(gridCoord);
  vec2 uv = (gridCoord * pxSize) / (0.5 * min(u_resolution.x, u_resolution.y));
  uv /= max(0.001, u_scale);

  float t = u_time * u_speed;
  vec3 lightDir = normalize(vec3(cos(1.5*t) + u_mouse.x*1.5, 0.8 - u_mouse.y*1.5, sin(1.25*t)));
  float shape = 0.0;

  if (u_shape < 1.5) {
    float d = 1.0 - dot(uv, uv);
    if (d > 0.0) { vec3 n = vec3(uv, sqrt(d)); shape = clamp(0.5+0.5*dot(lightDir,n), 0.0, 1.0); }
  } else if (u_shape < 2.5) {
    float R = 0.6, r = 0.22;
    vec2 q = uv * 2.5;
    float a = atan(q.y, q.x);
    vec2 p2 = vec2(length(q) - R, 0.0);
    p2 = mat2(cos(a), -sin(a), sin(a), cos(a)) * p2;
    float d = length(p2) - r;
    if (d < 0.0) { vec3 n = normalize(vec3(p2, sqrt(max(0.001, 1.0-d*d)))); shape = clamp(0.5+0.5*dot(lightDir,n), 0.0, 1.0); }
  } else if (u_shape < 3.5) {
    float a = atan(uv.y, uv.x);
    float r = length(uv);
    float swirl = a + r * 8.0 - t * 2.0;
    shape = smoothstep(0.3, 0.35, r) * (1.0 - smoothstep(0.7, 0.75, r));
    shape *= 0.5 + 0.5 * sin(swirl * 6.0);
  } else if (u_shape < 4.5) {
    float n = fbm(uv * 3.0 + t * 0.5);
    shape = smoothstep(0.3, 0.7, n);
  } else if (u_shape < 5.5) {
    float r = length(uv);
    float wave = sin(r * 20.0 - t * 4.0);
    shape = smoothstep(0.0, 0.3, wave) * (1.0 - smoothstep(0.0, 0.8, r));
  } else if (u_shape < 6.5) {
    float r = length(uv);
    float ring = abs(r - 0.7);
    float planet = 1.0 - smoothstep(0.0, 0.02, r - 0.45);
    float ringShape = 1.0 - smoothstep(0.0, 0.06, ring);
    vec3 n = vec3(uv / max(0.001, r), sqrt(max(0.0, 1.0 - r*r)));
    shape = max(planet * clamp(0.5+0.5*dot(lightDir,n), 0.0, 1.0), ringShape * 0.6);
  } else if (u_shape < 7.5) {
    shape = noise(uv * 10.0 + t);
  } else {
    vec2 d = abs(uv) - 0.6;
    float dist = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    if (dist < 0.0) { vec3 n = vec3(sign(d.x)*step(abs(d.y),abs(d.x)), sign(d.y)*step(abs(d.x),abs(d.y)), 0.0); shape = clamp(0.5+0.5*dot(lightDir,n), 0.0, 1.0); }
  }

  float dither = 0.0;
  if (u_ditherType == 1) { dither = fract(sin(dot(gridCoord, vec2(12.9898,78.233)))*43758.5453)-0.5; }
  else if (u_ditherType == 2) { dither = getBayer2(iGrid)-0.5; }
  else if (u_ditherType == 4) { dither = getBayer8(iGrid)-0.5; }
  else { dither = getBayer4(iGrid)-0.5; }

  float result = step(0.5, shape + dither);
  vec3 fgColor = u_color.rgb * u_color.a;
  fragColor = vec4(fgColor * result, u_color.a * result);
}
`;

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
  return s;
}

const vs = createShader(gl.VERTEX_SHADER, vertexShaderSrc);
const fs = createShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const loc = {};
['u_resolution','u_time','u_pxSize','u_color','u_mouse','u_scale','u_shape','u_ditherType','u_speed'].forEach(n => loc[n] = gl.getUniformLocation(program, n));

function resize() {
  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
}

function render(time) {
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform2f(loc.u_resolution, canvas.width, canvas.height);
  gl.uniform1f(loc.u_time, time * 0.001);
  gl.uniform1f(loc.u_pxSize, state.pxSize * (window.devicePixelRatio || 1));
  gl.uniform4fv(loc.u_color, state.color);
  gl.uniform2f(loc.u_mouse, state.mouseX, state.mouseY);
  gl.uniform1f(loc.u_scale, state.scale);
  gl.uniform1f(loc.u_shape, state.shape);
  gl.uniform1i(loc.u_ditherType, state.ditherType);
  gl.uniform1f(loc.u_speed, state.speed);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  state.mouseX = ((e.clientX - r.left) / r.width) * 2 - 1;
  state.mouseY = -(((e.clientY - r.top) / r.height) * 2 - 1);
});
canvas.addEventListener('mouseleave', () => { state.mouseX = 0; state.mouseY = 0; });

document.querySelectorAll('.shape-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.shape = parseFloat(btn.dataset.shape);
  });
});

document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const c = btn.dataset.color.split(',').map(Number);
    state.color = [...c, 1.0];
  });
});

document.getElementById('customColor').addEventListener('input', e => {
  const hex = e.target.value;
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  state.color = [r, g, b, 1.0];
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
});

document.getElementById('ditherType').addEventListener('change', e => state.ditherType = parseInt(e.target.value));
document.getElementById('pxSize').addEventListener('input', e => { state.pxSize = parseFloat(e.target.value); document.getElementById('pxSizeVal').textContent = state.pxSize.toFixed(1)+' px'; });
document.getElementById('speed').addEventListener('input', e => { state.speed = parseFloat(e.target.value); document.getElementById('speedVal').textContent = state.speed.toFixed(1)+'x'; });
document.getElementById('scale').addEventListener('input', e => { state.scale = parseFloat(e.target.value); document.getElementById('scaleVal').textContent = state.scale.toFixed(2)+'x'; });

requestAnimationFrame(render);
</script>
{{end}}
